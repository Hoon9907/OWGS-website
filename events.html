    <script>
      (() => {
        const preview = document.getElementById('event-preview');
        const opensAt = Date.parse(preview.querySelector('time').dateTime);

        const revealEvents = () => {
          const remaining = opensAt - Date.now();
          if (remaining > 0) {
            setTimeout(revealEvents, Math.min(remaining, 2147483647));
            return;
          }

          const template = document.getElementById('event-details');
          const content = template.content.cloneNode(true);
          const carousel = content.querySelector('.event-carousel');
          const slides = carousel.querySelector('#event-slides');
          const cards = [...slides.querySelectorAll('.event-card')];
          const dotGroup = carousel.querySelector('.event-carousel-dots');
          let current = 0;
          let timer;
          let finishTransition;
          const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');

          const showCard = (index, direction = 0) => {
            finishTransition?.();
            const previous = cards[current];
            current = (index + cards.length) % cards.length;
            const incoming = cards[current];
            cards.forEach((card, cardIndex) => {
              card.hidden = current !== cardIndex;
            });
            dots.forEach((dot, dotIndex) => {
              dot.setAttribute('aria-current', String(current === dotIndex));
            });

            if (!direction || reducedMotion.matches || previous === incoming) return;

            previous.hidden = false;
            previous.inert = true;
            const timing = { duration: 520, easing: 'cubic-bezier(.22,.61,.36,1)' };
            const exit = previous.animate([
              { transform: 'translateX(0)', opacity: 1 },
              { transform: `translateX(${-direction * 30}%) rotateY(${direction * 9}deg)`, opacity: 0 }
            ], timing);
            const enter = incoming.animate([
              { transform: `translateX(${direction * 30}%) rotateY(${-direction * 9}deg)`, opacity: 0 },
              { transform: 'translateX(0)', opacity: 1 }
            ], timing);
            finishTransition = () => {
              enter.onfinish = null;
              previous.hidden = true;
              previous.inert = false;
              exit.cancel();
              enter.cancel();
              finishTransition = undefined;
            };
            enter.onfinish = finishTransition;
          };

          const setPlaying = playing => {
            clearInterval(timer);
            if (playing) {
              timer = setInterval(() => {
                if (!document.hidden && !slides.matches(':hover, :focus-within')) {
                  showCard(current + 1, 1);
                }
              }, 8000);
            }
          };

          const dots = cards.map((card, index) => {
            const dot = document.createElement('button');
            dot.type = 'button';
            dot.setAttribute('aria-label', card.querySelector('h2').textContent);
            dot.setAttribute('aria-controls', 'event-slides');
            dot.addEventListener('click', () => {
              showCard(index, Math.sign(index - current));
              setPlaying(!reducedMotion.matches);
            });
            dotGroup.append(dot);
            return dot;
          });

          carousel.querySelectorAll('[data-event-step]').forEach(button => {
            button.addEventListener('click', () => {
              const direction = Number(button.dataset.eventStep);
              showCard(current + direction, direction);
              setPlaying(!reducedMotion.matches);
            });
          });
          showCard(0);
          preview.replaceWith(content);
          template.remove();
          setPlaying(!reducedMotion.matches);
        };

        revealEvents();
      })();
    </script>
