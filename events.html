    <!-- 공유 미리보기(카카오톡·SNS): 배포 후 og:url, og:image를 실제 도메인 전체 주소로 바꾸세요.

            이미지 넣는 방법
            1. 이미지를 assets/images/events/ 에 넣습니다. 권장: 가로 1920px 이상 PNG/JPG
            2. 아래 '공개 전' 블록(<div class="media-frame media-empty"> … </div>)을 지우고 다음으로 바꿉니다.

              <div class="panel-block">
                <div class="panel-block-head">

                </div>
              </div>

            width / height 에는 실제 이미지의 픽셀 크기를 적어 주세요.

          <div class="media-frame media-empty">
